<div class="prompt-item">
    <div class="prompt-item__image" data-sly-test="${properties.fileReference}">
        <img src="${properties.fileReference}" alt="${properties.title}" class="prompt-item__img">
    </div>
    <div class="prompt-item__content">
        <h3 class="prompt-item__title">
            ${properties.title}
        </h3>
    </div>
    <div class="prompt-item__image__arrow" data-sly-test="${properties.arrowIcon}">
        <a href="${properties.ctaLink}" data-sly-test="${properties.ctaLink}">
            <img src="${properties.arrowIcon}" alt="${properties.title}" class="prompt-item__img__arrow">
        </a>
    </div>
</div>
