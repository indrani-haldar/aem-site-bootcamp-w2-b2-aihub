<div class="responsible-ai">
    <div class="responsible-ai__image" data-sly-test="${properties.fileReference}">
        <img src="${properties.fileReference}" alt="${properties.title}" class="responsible-ai__img">
    </div>
    <div class="responsible-ai__content">
        <h3 class="responsible-ai__title">
            ${properties.title}
        </h3>
        <p class="responsible-ai__description">
            ${properties.description}
        </p>
    </div>
    <div class="responsible-ai__image__arrow" data-sly-test="${properties.arrowIcon}">
        <a href="${properties.ctaLink}">
            <img src="${properties.arrowIcon}" alt="${properties.title}" class="responsible-ai__img__arrow">
        </a>
    </div>
</div>
